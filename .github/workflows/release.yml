name: Build & Release Windows Single Executable

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Single Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        shell: pwsh
        run: |
          pytest fnf_fast_converter/tests/test_packaging.py fnf_fast_converter/tests/test_web_gui.py fnf_fast_converter/tests/test_cli.py fnf_fast_converter/tests/test_dta.py fnf_fast_converter/tests/test_image.py fnf_fast_converter/tests/test_ini.py fnf_fast_converter/tests/test_mogg.py fnf_fast_converter/tests/test_pipeline.py fnf_fast_converter/tests/test_repair.py fnf_fast_converter/tests/test_stfs.py

      - name: Build single-file Windows executable & release zip
        shell: pwsh
        run: |
          python build_standalone.py

      - name: Smoke test single executable
        shell: pwsh
        run: |
          .\dist\FNF_Fast_Converter\FNF_Fast_Converter.exe --help

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF_Fast_Converter-windows-x64
          path: dist/*.zip

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem -Path "dist\*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No release zip found in dist/" }
          gh release create $tag $zip.FullName `
            --title "$tag - Standalone Single-Executable Web UI (Windows x64)" `
            --notes "Zero-dependency single executable (`FNF_Fast_Converter.exe`) with embedded Web UI. Download, extract, and open `FNF_Fast_Converter.exe` (or `Run_Converter.bat`)."
